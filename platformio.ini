; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` defaults to building firmware. Native envs are test-only;
; running `pio run` against them is meaningless (no main(), no Arduino
; framework). For tests, invoke explicitly:
;   pio test -e native -e native_dal
default_envs = m5stack-stickc

[env:m5stack-stickc]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; This env hosts no runnable tests; native test code has no setup()/loop()
; which the Arduino framework requires. `pio test` runs the native envs.
test_ignore = *
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -Wformat
    -Wformat-security
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    crankyoldgit/IRremoteESP8266
    kosme/arduinoFFT

[env:native]
platform = native
test_framework = unity
; Default native env: header-only tests. Compiles no src/ files; each test
; provides any infrastructure it needs (e.g. test_hal_capability_query and
; test_dal_registry both ship their own miniature HAL backend).
test_build_src = no
build_src_filter = -<*>
test_filter = test_sanity, test_pixmob_parity, test_hal_capability_query
build_flags =
    -std=gnu++17
    -Wformat
    -Wformat-security
    -I include
    -I test/support

; Tests that exercise src/dal/dal.cpp need src/ compiled in; this env opts in.
; src/hal_stickc/ stays out via the build_src_filter; test_dal_registry
; provides its own HAL backend inline.
[env:native_dal]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/>
test_filter = test_dal_registry
