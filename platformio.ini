; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` defaults to building firmware. Native envs are test-only;
; running `pio run` against them is meaningless (no main(), no Arduino
; framework). For tests, invoke explicitly:
;   pio test -e native -e native_dal -e native_modes -e native_effects -e native_espnow -e native_audio -e native_analyser -e native_plugin -e native_input_action -e native_visualisation -e native_output_binding -e native_beat_pulse -e native_output_binding_concrete -e native_master_overlay -e native_spectrum_bars
default_envs = m5stack-stickcplus2

; Common firmware-build settings shared by every host-specific env. Each
; concrete env (m5stack-stickcplus2, future m5stack-stickcs3, etc.) extends
; this base and adds (a) its PlatformIO board id, and (b) a build_src_filter
; whitelisting exactly one HAL backend folder under src/. Only one HAL
; backend can be linked into a single binary because each one provides the
; same hal::HAL static-facade symbols.
[env:firmware-base]
platform = espressif32@6.7.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; Firmware envs host no runnable tests; native test code has no
; setup()/loop() which the Arduino framework requires. `pio test` runs
; the native envs.
test_ignore = *
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -Wformat
    -Wformat-security
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    crankyoldgit/IRremoteESP8266
    kosme/arduinoFFT
    ; Epic 12: Grove SK6812 flex strip + Atom onboard WS2812C. Pulled
    ; into firmware-base so every firmware env (Plus2 / S3 / Atom Lite)
    ; can drive a strip on its Grove port without env-specific lib
    ; juggling.
    adafruit/Adafruit NeoPixel

[env:m5stack-stickcplus2]
extends = env:firmware-base
board = m5stick-c
; Whitelist exactly the StickC Plus2 HAL backend so adding a sibling
; backend (e.g. src/hal_stickcs3/) doesn't link both into one binary.
build_src_filter = -<*> +<main.cpp> +<dal/> +<effects/> +<hal/> +<modes/> +<output_bindings/> +<plugins/> +<shows/> +<widgets/> +<transport/> +<visualisations/> +<hal_stickcplus2/>
; LED-strip defaults (Epic 12). Operator-tunable per env in case a
; deployment ships a non-default strip out of the box. Out-of-box
; values match a 20 cm SK6812 strip on the Grove port; change
; CHAIN_SIZE if the deployment uses a different length. Uncomment
; NOCT_STRIP_FORCE_DEFAULTS to make each reflash write these
; values to NVS authoritatively (overriding any operator-changed
; settings) - useful for deployment-time consistency. Without the
; force flag, these are only the first-boot fallback when NVS is
; empty; the Config menu overrides at runtime.
build_flags =
    ${env:firmware-base.build_flags}
    -DNOCT_DEFAULT_STRIP_ENABLED=1
    -DNOCT_DEFAULT_STRIP_BRIGHTNESS=1
    -DNOCT_DEFAULT_STRIP_GROUP_SIZE=12
    -DNOCT_DEFAULT_STRIP_CHAIN_SIZE=29
    ; -DNOCT_STRIP_FORCE_DEFAULTS=1

; M5StickS3 (ESP32-S3, project's future reference platform). PlatformIO has
; no dedicated board ID for the StickS3, so we use the generic ESP32-S3
; DevKitC-1 board and let M5Unified detect the host at runtime via its
; board_t::board_M5StickS3 path. Native USB-OTG flags route Serial through
; the chip's USB peripheral instead of a UART bridge.
[env:m5stack-stickcs3]
extends = env:firmware-base
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:firmware-base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LED-strip defaults (Epic 12) - see [env:m5stack-stickcplus2] for
    ; the override semantics. Uncomment NOCT_STRIP_FORCE_DEFAULTS to
    ; make each reflash authoritative.
    -DNOCT_DEFAULT_STRIP_ENABLED=1
    -DNOCT_DEFAULT_STRIP_BRIGHTNESS=1
    -DNOCT_DEFAULT_STRIP_GROUP_SIZE=12
    -DNOCT_DEFAULT_STRIP_CHAIN_SIZE=29
    ; -DNOCT_STRIP_FORCE_DEFAULTS=1
; esp-dsp headers and pre-built objects ship inside the arduino-esp32
; SDK bundle (tools/sdk/esp32s3/include/esp-dsp/ + libdsp.a), so no
; separate lib_deps entry is needed - MicStickCS3 just includes the
; relevant esp-dsp headers and the linker picks up the symbols. The
; Plus2 backend stays on arduinoFFT and is unaware (HAL-local choice).
build_src_filter = -<*> +<main.cpp> +<dal/> +<effects/> +<hal/> +<modes/> +<output_bindings/> +<plugins/> +<shows/> +<widgets/> +<transport/> +<visualisations/> +<hal_stickcs3/>

; M5Atom Lite (ESP32 PICO, single core). Epic 12 host. No display, no
; mic, no IR, no IMU - the lightest field Lume the project ships. The
; m5stack-atom PlatformIO board id covers both Atom Lite and Atom
; Matrix; this backend targets Lite specifically (the Matrix has a 5x5
; LED grid that needs a different LedStrip mapping). Pulls in
; Adafruit_NeoPixel for the onboard WS2812C + the Grove SK6812 strip.
[env:m5stack-atomlite]
extends = env:firmware-base
board = m5stack-atom
build_src_filter = -<*> +<main.cpp> +<dal/> +<effects/> +<hal/> +<modes/> +<output_bindings/> +<plugins/> +<shows/> +<widgets/> +<transport/> +<visualisations/> +<hal_atomlite/>
; LED-strip defaults (Epic 12). The Atom Lite has no display so no
; Config menu reaches these settings at runtime - the operator's
; ONLY way to configure chain size and group size is via these
; build flags + a reflash. NOCT_STRIP_FORCE_DEFAULTS is ENABLED by
; default for the Atom so every reflash is authoritative; change
; the CHAIN_SIZE / GROUP_SIZE values to suit each deployment, then
; reflash. Without the force flag the values only matter on a fresh
; NVS namespace (e.g. after a factory reset on a Stick).
build_flags =
    ${env:firmware-base.build_flags}
    -DNOCT_DEFAULT_STRIP_ENABLED=1
    -DNOCT_DEFAULT_STRIP_BRIGHTNESS=1
    -DNOCT_DEFAULT_STRIP_GROUP_SIZE=12
    -DNOCT_DEFAULT_STRIP_CHAIN_SIZE=29
    -DNOCT_STRIP_FORCE_DEFAULTS=1

; M5 AtomS3 Lite + Atomic PoE Base (W5500). Headless, dedicated DMX
; Director: receives sACN/Art-Net over wired Ethernet and broadcasts to the
; fleet over ESP-NOW. Wired Ethernet (W5500 on SPI) keeps the WiFi radio
; free for ESP-NOW, so there is no channel-coexistence problem.
;   NOCT_DMX_ETHERNET     - swaps DmxBridge's USB-CDC DMX source for the
;                           Ethernet sACN/Art-Net adapter.
;   NOCT_HEADLESS_DMX_BRIDGE - boot straight into DmxBridge (no screen /
;                           buttons to navigate the menu).
[env:m5stack-atoms3-poe]
extends = env:firmware-base
board = m5stack-atoms3
board_build.arduino.partitions = default_8MB.csv
; Native USB-Serial-JTAG (same as StickS3): the default 1.5M stub handoff
; desyncs ("No serial data received"). Flash via the ROM loader instead.
upload_speed = 115200
upload_flags = --no-stub
build_flags =
    ${env:firmware-base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB_MODE=0 (TinyUSB CDC) NOT 1 (hardware USB-Serial-JTAG): the JTAG
    ; peripheral hardware-resets the S3 when the host toggles DTR/RTS on
    ; port open, which would reboot the Director the instant a laptop
    ; connects to the config console. TinyUSB delivers DTR/RTS as plain
    ; firmware events with no reset path, so connecting serial is invisible
    ; to the running firmware - the broadcast never blips.
    -DARDUINO_USB_MODE=0
    -DNOCT_DMX_ETHERNET
    -DNOCT_HEADLESS_DMX_BRIDGE
lib_deps =
    ${env:firmware-base.lib_deps}
    arduino-libraries/Ethernet
build_src_filter = -<*> +<main.cpp> +<dal/> +<effects/> +<hal/> +<modes/> +<output_bindings/> +<plugins/> +<shows/> +<widgets/> +<transport/> +<visualisations/> +<hal_atoms3poe/>

[env:native]
platform = native
test_framework = unity
; Default native env: header-only tests. Compiles no src/ files; each test
; provides any infrastructure it needs (e.g. test_hal_capability_query and
; test_dal_registry both ship their own miniature HAL backend).
test_build_src = no
build_src_filter = -<*>
test_filter = test_sanity, test_pixmob_parity, test_hal_capability_query
build_flags =
    -std=gnu++17
    -Wformat
    -Wformat-security
    -I include
    -I test/support

; Tests that exercise src/dal/dal.cpp need src/ compiled in; this env opts in.
; src/hal_stickcplus2/ stays out via the build_src_filter; test_dal_registry
; provides its own HAL backend inline. transport/ is compiled in because
; the EspNowBroadcastDriver registered by DAL::begin() references the
; ESP-NOW frame encoders (Epic 4.6 Block 2).
[env:native_dal]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_dal_registry, test_dal_extensibility, test_pixmob_ir_wash

; Mode FSM tests: need src/dal/ + src/modes/ + src/transport/ compiled in.
; The test provides its own miniature HAL backend so DAL::begin() can compose
; a host profile that declares Buttons + Mic as inputs. transport/ is here
; because mode_machine.cpp now references the ESP-NOW frame encoders for
; Director broadcast and LumeMode receive (Epic 4 Block 3).
; plugins/ + visualisations/ are pulled in for Epic 4.6 Block 8:
; DirectorMode now resolves an active Visualisation from the
; registry on enter() and forwards events through it; the BeatPulse vis
; singleton + its PropertyBag link into this env via src/visualisations/.
[env:native_modes]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<modes/> +<effects/> +<transport/> +<plugins/> +<shows/> +<widgets/> +<visualisations/> +<output_bindings/>
test_filter = test_mode_machine

; Effect-class tests: need src/dal/ + src/effects/ compiled in. Each test
; instantiates a concrete Effect against a recording TestDriver and asserts
; the IR events that landed. transport/ is compiled in because dal/'s
; EspNowBroadcastDriver references the ESP-NOW frame encoders.
[env:native_effects]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<effects/> +<transport/> +<modes/persistence.cpp>
test_filter = test_effects

; DMX tests (Epic 7 B1, B2): pure-logic coverage of the Enttec DMX USB
; Pro framing parser and the 12-channel-per-Lume-group channel mapper.
; Neither file pulls in HAL, Arduino, or radio; the DmxUsbCdcAdapter is
; Arduino-only and stays out of the native build.
[env:native_dmx]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/drivers/dmx_input_parser.cpp> +<dal/drivers/dmx_channel_mapper.cpp>
test_filter = test_dmx_input_parser, test_dmx_channel_mapper

; ESP-NOW frame format + transport-agnostic signal-quality tests: pure
; logic, no HAL or radio dependencies. Compiles src/transport/ only.
[env:native_espnow]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<transport/>
test_filter = test_espnow_frame, test_signal_quality, test_tofu_lock

; Audio analyser test harness (Epic 4.5 Block 1): synthetic sample
; generators (sine / kick-train / noise / silence) + 16-bit PCM mono
; WAV I/O. Pure host code with no src/ dependency yet; the analyser-
; output assertions land in Block 2 once the capability surface ships.
[env:native_audio]
extends = env:native
test_filter = test_audio_pipeline

; DAL audio analyser core tests (Epic 4.5 Blocks 2a / 3a / 4a): pure-
; function band-routing logic + sub-band adaptive-threshold beat
; detector + drop/breakdown detector exercised against synthetic
; FFT-magnitude vectors and bass-energy streams. Compiles
; src/dal/analyser/ only; no HAL or radio deps.
[env:native_analyser]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/analyser/>
test_filter = test_analyser_core, test_beat_detector, test_drop_detector, test_music_descriptors, test_section_detector

; Plugin base infrastructure tests (Epic 4.6 Block 3): CapabilityMask,
; PropertyValue/PropertyDef, PropertyBag (native in-memory backend), and
; Registry<T> mechanics. Compiles src/plugins/ only - the property bag's
; native build path is in-memory; the Arduino NVS path is exercised via
; the firmware build envs, not here.
[env:native_plugin]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/>
test_filter = test_plugin

; Input-action mapper tests (Epic 4.6 Block 4): pure-function 2-button
; semantic-action mapping table exercised against synthesised
; (ButtonId, ButtonEvent) sequences. Compiles src/hal/ only - no DAL,
; no modes, no transport; the mapper is intentionally stateless and
; dependency-free so a future Tildagon backend can substitute its own
; 6-button mapper without touching anything else.
[env:native_input_action]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<hal/>
test_filter = test_input_action

; Visualisation contract tests (Epic 4.6 Block 5): abstract Visualisation
; base, VisualisationContext services surface, and VisualisationRegistry
; singleton. The test ships a tiny StubVisualisation + a minimal
; Display-providing HAL backend inline so DAL::begin() composes a host
; profile with RgbPulse on the "local" target and the LocalDriver
; dispatch returns true. Pulls in plugins/ (PropertyBag), dal/ (DAL +
; LocalDriver), hal/ (input mapper referenced by LocalDriver), and
; transport/ (encoder symbols pulled in by EspNowBroadcastDriver).
[env:native_visualisation]
extends = env:native
test_build_src = yes
; Block 8 added beat_pulse.cpp under src/visualisations/; that TU owns an
; effects::Pulse and calls envelope_for_bpm(), so effects/ has to link in
; here even though test_visualisation itself doesn't instantiate BeatPulse.
build_src_filter = -<*> +<plugins/> +<visualisations/> +<effects/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_visualisation

; BeatPulse visualisation tests (Epic 4.6 Block 8): the first concrete
; Visualisation, exercised against a recording driver registered on a
; test "all-pixmobs" + "esp-now-broadcast" target so the per-beat render
; fan-out can be asserted byte-for-byte against the pre-migration shape.
; Pulls in plugins/ (PropertyBag), visualisations/ (BeatPulse + the
; Visualisation contract TUs), effects/ (Pulse), dal/ (LocalDriver +
; render_fx), hal/ (input mapper), and transport/ (encoder symbols
; pulled in by EspNowBroadcastDriver registered by DAL::begin).
[env:native_beat_pulse]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<visualisations/> +<effects/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_beat_pulse

; Output-binding contract tests (Epic 4.6 Block 6): abstract OutputBinding
; base, OutputBindingContext services surface, and OutputBindingRegistry
; singleton. The test ships a tiny StubOutputBinding + a minimal HAL
; backend declaring a deliberate subset of host-surface capabilities so
; host_caps() can be asserted both for presence and absence. Pulls in
; plugins/ (PropertyBag), output_bindings/ (the new TUs), dal/ (only for
; the RgbPulseEvent type), hal/ (input mapper / capability list), and
; transport/ (encoder symbols pulled in by EspNowBroadcastDriver).
[env:native_output_binding]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<output_bindings/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_output_binding

; Director overlay tests (Epic 4.6 Block 10): picker + settings
; state machines, NVS active-vis persistence, status-strip label, and the
; "saved id doesn't resolve" fallback. Linked source set mirrors
; native_modes (we drive the whole mode FSM through ModeMachine), with one
; difference: the test registers BeatPulse into the visualisation registry
; in setUp() so the picker has something to show beyond "<- Menu".
[env:native_master_overlay]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<modes/> +<effects/> +<transport/> +<plugins/> +<shows/> +<widgets/> +<visualisations/> +<output_bindings/>
test_filter = test_autonomous_master_overlay

; Concrete output-binding tests: PixMobIrBinding singleton + per-binding
; render fan-out, plus the one-shot NVS migration shim (slv_ir_grp ->
; nb_pixmob-ir/group). LocalDisplayBinding was retired in Epic 13 B0;
; future text + bitmap bindings (Epic 13 B2 / B6) add their own tests
; into the same env.
; Pulls in output_bindings/ (the concrete TUs), plugins/ (PropertyBag),
; dal/ (driver registry + render_fx), hal/ (input mapper / capability
; list), transport/ (encoder symbols), and modes/persistence.cpp only
; (the migration shim plus its native-test seam live there - linking
; the full modes/ tree would drag in lume_mode and friends that this
; env doesn't exercise).
[env:native_output_binding_concrete]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<output_bindings/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_output_binding_concrete

; SpectrumBars visualisation tests (Epic 4.6 Block 11): the second
; concrete Visualisation, exercised against recording test drivers
; registered on "ir-pixmob" + "esp-now-broadcast" so the manual-beat
; (InputAction::Confirm) fan-out can be asserted byte-by-byte. Source
; tree mirrors native_beat_pulse: plugins/ (PropertyBag), visualisations/
; (the new SpectrumBars TU + the existing Visualisation contract TUs),
; effects/ (linked because beat_pulse.cpp shares the TU set and owns an
; effects::Pulse), dal/ (LocalDriver + render_fx), hal/ (input mapper),
; transport/ (encoder symbols pulled in by EspNowBroadcastDriver).
[env:native_spectrum_bars]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<visualisations/> +<effects/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_spectrum_bars

; Widget library tests (Epic 4.7 Block 2). BeatBarWidget +
; SpectrumBarsWidget are pure render helpers; tests cover the
; value-clamping contract, the 32-band -> 7-perceptual roll-up math,
; and that draw() emits the expected count of DAL fill_rect / text
; calls (pixel-level rendering is verified by hardware bring-up).
; Compiles widgets/ + plugins/ (PropertyBag is not needed but the
; build keeps them grouped) + dal/ (LocalDriver + fill_rect routing)
; + hal/ + transport/ (encoder symbols pulled in by DAL::begin).
[env:native_widgets]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<widgets/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_widgets

; Show plug-in framework + SimpleBeatShow tests (Epic 4.7 Block 1). The
; first concrete Show, exercised against recording drivers registered
; on "ir-pixmob" + "esp-now-broadcast" so the per-beat render fan-out
; can be asserted byte-for-byte against the pre-Block-1 BeatPulse
; shape. Also exercises the active_vis -> active_show NVS migration in
; modes/persistence.cpp via the native test seam. Source tree pulls in
; plugins/ (PropertyBag), shows/ (Show framework + SimpleBeatShow),
; effects/ (Pulse), dal/ (LocalDriver + render_fx), hal/ (input
; mapper), transport/ (encoder symbols), and modes/persistence.cpp
; only (linking the full modes/ tree drags in lume_mode and friends
; this env does not exercise).
[env:native_show]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<shows/> +<widgets/> +<effects/> +<dal/> +<hal/> +<transport/> +<modes/persistence.cpp>
test_filter = test_show, test_dynamic_show, test_bass_and_drift_show

; Epic 12 B2: LedStripDriver tests. Pure-logic coverage of the wash
; state machine, drift envelope, and sparkle dispatch. The test injects
; a recording mock for hal::LedStrip via the driver's set_strip_override
; seam, so no HAL backend is wired in - only the driver source compiles.
[env:native_led_strip]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/drivers/led_strip_driver.cpp>
test_filter = test_led_strip_driver
