; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` defaults to building firmware. Native envs are test-only;
; running `pio run` against them is meaningless (no main(), no Arduino
; framework). For tests, invoke explicitly:
;   pio test -e native -e native_dal -e native_modes -e native_effects -e native_espnow -e native_audio -e native_analyser -e native_plugin -e native_input_action -e native_visualisation -e native_output_binding
default_envs = m5stack-stickcplus2

; Common firmware-build settings shared by every host-specific env. Each
; concrete env (m5stack-stickcplus2, future m5stack-stickcs3, etc.) extends
; this base and adds (a) its PlatformIO board id, and (b) a build_src_filter
; whitelisting exactly one HAL backend folder under src/. Only one HAL
; backend can be linked into a single binary because each one provides the
; same hal::HAL static-facade symbols.
[env:firmware-base]
platform = espressif32@6.7.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; Firmware envs host no runnable tests; native test code has no
; setup()/loop() which the Arduino framework requires. `pio test` runs
; the native envs.
test_ignore = *
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -Wformat
    -Wformat-security
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    crankyoldgit/IRremoteESP8266
    kosme/arduinoFFT

[env:m5stack-stickcplus2]
extends = env:firmware-base
board = m5stick-c
; Whitelist exactly the StickC Plus2 HAL backend so adding a sibling
; backend (e.g. src/hal_stickcs3/) doesn't link both into one binary.
build_src_filter = -<*> +<main.cpp> +<dal/> +<effects/> +<hal/> +<modes/> +<plugins/> +<transport/> +<hal_stickcplus2/>

; M5StickS3 (ESP32-S3, project's future reference platform). PlatformIO has
; no dedicated board ID for the StickS3, so we use the generic ESP32-S3
; DevKitC-1 board and let M5Unified detect the host at runtime via its
; board_t::board_M5StickS3 path. Native USB-OTG flags route Serial through
; the chip's USB peripheral instead of a UART bridge.
[env:m5stack-stickcs3]
extends = env:firmware-base
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:firmware-base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; esp-dsp headers and pre-built objects ship inside the arduino-esp32
; SDK bundle (tools/sdk/esp32s3/include/esp-dsp/ + libdsp.a), so no
; separate lib_deps entry is needed - MicStickCS3 just includes the
; relevant esp-dsp headers and the linker picks up the symbols. The
; Plus2 backend stays on arduinoFFT and is unaware (HAL-local choice).
build_src_filter = -<*> +<main.cpp> +<dal/> +<effects/> +<hal/> +<modes/> +<plugins/> +<transport/> +<hal_stickcs3/>

[env:native]
platform = native
test_framework = unity
; Default native env: header-only tests. Compiles no src/ files; each test
; provides any infrastructure it needs (e.g. test_hal_capability_query and
; test_dal_registry both ship their own miniature HAL backend).
test_build_src = no
build_src_filter = -<*>
test_filter = test_sanity, test_pixmob_parity, test_hal_capability_query
build_flags =
    -std=gnu++17
    -Wformat
    -Wformat-security
    -I include
    -I test/support

; Tests that exercise src/dal/dal.cpp need src/ compiled in; this env opts in.
; src/hal_stickcplus2/ stays out via the build_src_filter; test_dal_registry
; provides its own HAL backend inline. transport/ is compiled in because
; the EspNowBroadcastDriver registered by DAL::begin() references the
; ESP-NOW frame encoders (Epic 4.6 Block 2).
[env:native_dal]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<transport/>
test_filter = test_dal_registry, test_dal_extensibility

; Mode FSM tests: need src/dal/ + src/modes/ + src/transport/ compiled in.
; The test provides its own miniature HAL backend so DAL::begin() can compose
; a host profile that declares Buttons + Mic as inputs. transport/ is here
; because mode_machine.cpp now references the ESP-NOW frame encoders for
; AutonomousMaster broadcast and SlaveMode receive (Epic 4 Block 3).
[env:native_modes]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<modes/> +<effects/> +<transport/>
test_filter = test_mode_machine

; Effect-class tests: need src/dal/ + src/effects/ compiled in. Each test
; instantiates a concrete Effect against a recording TestDriver and asserts
; the IR events that landed. transport/ is compiled in because dal/'s
; EspNowBroadcastDriver references the ESP-NOW frame encoders.
[env:native_effects]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/> +<hal/> +<effects/> +<transport/>
test_filter = test_effects

; ESP-NOW frame format + transport-agnostic signal-quality tests: pure
; logic, no HAL or radio dependencies. Compiles src/transport/ only.
[env:native_espnow]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<transport/>
test_filter = test_espnow_frame, test_signal_quality

; Audio analyser test harness (Epic 4.5 Block 1): synthetic sample
; generators (sine / kick-train / noise / silence) + 16-bit PCM mono
; WAV I/O. Pure host code with no src/ dependency yet; the analyser-
; output assertions land in Block 2 once the capability surface ships.
[env:native_audio]
extends = env:native
test_filter = test_audio_pipeline

; DAL audio analyser core tests (Epic 4.5 Blocks 2a / 3a / 4a): pure-
; function band-routing logic + sub-band adaptive-threshold beat
; detector + drop/breakdown detector exercised against synthetic
; FFT-magnitude vectors and bass-energy streams. Compiles
; src/dal/analyser/ only; no HAL or radio deps.
[env:native_analyser]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/analyser/>
test_filter = test_analyser_core, test_beat_detector, test_drop_detector

; Plugin base infrastructure tests (Epic 4.6 Block 3): CapabilityMask,
; PropertyValue/PropertyDef, PropertyBag (native in-memory backend), and
; Registry<T> mechanics. Compiles src/plugins/ only - the property bag's
; native build path is in-memory; the Arduino NVS path is exercised via
; the firmware build envs, not here.
[env:native_plugin]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/>
test_filter = test_plugin

; Input-action mapper tests (Epic 4.6 Block 4): pure-function 2-button
; semantic-action mapping table exercised against synthesised
; (ButtonId, ButtonEvent) sequences. Compiles src/hal/ only - no DAL,
; no modes, no transport; the mapper is intentionally stateless and
; dependency-free so a future Tildagon backend can substitute its own
; 6-button mapper without touching anything else.
[env:native_input_action]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<hal/>
test_filter = test_input_action

; Visualisation contract tests (Epic 4.6 Block 5): abstract Visualisation
; base, VisualisationContext services surface, and VisualisationRegistry
; singleton. The test ships a tiny StubVisualisation + a minimal
; Display-providing HAL backend inline so DAL::begin() composes a host
; profile with RgbPulse on the "local" target and the LocalDriver
; dispatch returns true. Pulls in plugins/ (PropertyBag), dal/ (DAL +
; LocalDriver), hal/ (input mapper referenced by LocalDriver), and
; transport/ (encoder symbols pulled in by EspNowBroadcastDriver).
[env:native_visualisation]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<visualisations/> +<dal/> +<hal/> +<transport/>
test_filter = test_visualisation

; Output-binding contract tests (Epic 4.6 Block 6): abstract OutputBinding
; base, OutputBindingContext services surface, and OutputBindingRegistry
; singleton. The test ships a tiny StubOutputBinding + a minimal HAL
; backend declaring a deliberate subset of host-surface capabilities so
; host_caps() can be asserted both for presence and absence. Pulls in
; plugins/ (PropertyBag), output_bindings/ (the new TUs), dal/ (only for
; the RgbPulseEvent type), hal/ (input mapper / capability list), and
; transport/ (encoder symbols pulled in by EspNowBroadcastDriver).
[env:native_output_binding]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<plugins/> +<output_bindings/> +<dal/> +<hal/> +<transport/>
test_filter = test_output_binding
