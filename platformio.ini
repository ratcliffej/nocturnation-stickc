; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds only the firmware env. The native env exists for
; `pio test -e native` and has no firmware sources to compile.
default_envs = m5stack-stickc

[env:m5stack-stickc]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -Wformat
    -Wformat-security
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    crankyoldgit/IRremoteESP8266
    kosme/arduinoFFT

[env:native]
platform = native
test_framework = unity
; Native tests target pure logic only; never compile firmware sources
; (they pull in Arduino.h, M5Unified, etc. that don't exist on the host).
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wformat
    -Wformat-security
    -I include
    -I test/support
