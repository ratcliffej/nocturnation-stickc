; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; All three envs are default so `pio test` (no -e) runs the native test
; envs and `pio run` builds the firmware env. The firmware env has
; `test_ignore = *` so it skips its own (would-fail) test phase; the
; native envs have `build_src_filter = -<*>` so `pio run` against them
; does nothing useful but doesn't error.
default_envs = m5stack-stickc, native, native_dal

[env:m5stack-stickc]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; This env hosts no runnable tests; native test code has no setup()/loop()
; which the Arduino framework requires. `pio test` runs the native envs.
test_ignore = *
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -Wformat
    -Wformat-security
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    crankyoldgit/IRremoteESP8266
    kosme/arduinoFFT

[env:native]
platform = native
test_framework = unity
; Default native env: header-only tests. Compiles no src/ files; each test
; provides any infrastructure it needs (e.g. test_hal_capability_query and
; test_dal_registry both ship their own miniature HAL backend).
test_build_src = no
build_src_filter = -<*>
test_filter = test_sanity, test_pixmob_parity, test_hal_capability_query
build_flags =
    -std=gnu++17
    -Wformat
    -Wformat-security
    -I include
    -I test/support

; Tests that exercise src/dal/dal.cpp need src/ compiled in; this env opts in.
; src/hal_stickc/ stays out via the build_src_filter; test_dal_registry
; provides its own HAL backend inline.
[env:native_dal]
extends = env:native
test_build_src = yes
build_src_filter = -<*> +<dal/>
test_filter = test_dal_registry
